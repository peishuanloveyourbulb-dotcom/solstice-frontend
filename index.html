<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sol²</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Sol² 新家 · 裝修憲法 v1 · 奶白熊
   正式版第一根樑（index-bear.html，與舊家並存試住）
   規矩：所有顏色/圓角/字體只從 :root 取用；蜂蜜金只給
   日數、聊天鈕、釘選、開啟的開關；熊限量出場。
   ============================================================ */
:root{
  --milk:#FBF7F0; --card:#FFFFFF;
  --honey:#D9A441; --honey-soft:#F6EBD4;
  --cocoa:#4A3B2E; --taupe:#9B8C7A; --line:#EFE7DA;
  --danger:#B0563C;
  --r:22px; --r-bub:18px; --r-btn:14px;
  --shadow:0 6px 24px rgba(74,59,46,.06),0 1px 3px rgba(74,59,46,.05);
  --serif:'Cormorant Garamond',serif;
  --hand:'LXGW WenKai TC',serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100vh}
body{background:var(--milk);color:var(--cocoa);font-family:var(--hand);overflow:hidden}

/* ===== 視圖切換 ===== */
.view{position:fixed;inset:0;display:none;flex-direction:column;background:var(--milk)}
.view.on{display:flex}

/* ===== 密碼門 ===== */
#gate{align-items:center;justify-content:center;gap:22px}
#gate .bear{width:88px;height:88px}
#gate .bear .eye{transform-origin:center;animation:blink 5.4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%,97%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){#gate .bear .eye{animation:none}}
#gate h1{font-family:var(--serif);font-size:24px;letter-spacing:4px;font-weight:600}
#gate input{
  width:min(76vw,260px);border:1px solid var(--line);border-radius:20px;background:var(--card);
  font-family:var(--hand);font-size:16px;color:var(--cocoa);text-align:center;
  padding:12px 18px;outline:none;
}
#gate input:focus{border-color:var(--honey)}
#gate input.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#gate button{
  border:none;border-radius:20px;background:var(--honey);color:#fff;cursor:pointer;
  font-family:var(--hand);font-size:15px;padding:11px 40px;letter-spacing:2px;
  box-shadow:0 4px 12px rgba(217,164,65,.35);
}
#gate .err{font-size:12.5px;color:var(--danger);min-height:18px}

/* ===== 底欄 ===== */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:9px 22px calc(9px + env(safe-area-inset-bottom));
  align-items:center;justify-content:space-between;
}
body.in .nav{display:flex}
.nav button{
  border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--taupe);font-family:var(--hand);font-size:10.5px;letter-spacing:1px;
  min-width:52px;cursor:pointer;transition:color .18s;
}
.nav button.on{color:var(--cocoa)}
.nav button:focus-visible{outline:2px solid var(--honey);outline-offset:2px;border-radius:8px}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .mid{
  width:56px;height:56px;border-radius:50%;background:var(--honey);margin-top:-28px;
  align-items:center;justify-content:center;display:flex;
  box-shadow:0 8px 20px rgba(217,164,65,.38);border:4px solid var(--milk);
  transition:transform .15s;
}
.nav .mid:active{transform:scale(.93)}
.nav .mid svg{width:23px;height:23px;stroke:#fff;stroke-width:1.9}

/* ===== 首頁 ===== */
.hpage{flex:1;overflow-y:auto;padding:calc(30px + env(safe-area-inset-top)) 22px 110px;max-width:520px;margin:0 auto;width:100%}
.us{text-align:center}
.us-names{font-family:var(--serif);font-size:21px;letter-spacing:2.5px;font-weight:500;text-transform:uppercase}
.us-names b{font-weight:600}
.us-avas{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px}
.ava{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2.5px solid var(--card);box-shadow:var(--shadow);background:var(--honey-soft)}
.us .bear{width:40px;height:40px;flex-shrink:0}
.us .bear .eye{transform-origin:center;animation:blink 5.4s infinite}
@media (prefers-reduced-motion:reduce){.us .bear .eye{animation:none}}
.days{text-align:center;margin-top:26px}
.days-n{font-family:var(--serif);font-weight:600;font-size:104px;line-height:.9;color:var(--honey);letter-spacing:-2px}
.days-l{margin-top:10px;font-family:var(--serif);font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--taupe)}
.days-since{margin-top:6px;font-size:12.5px;color:var(--taupe);letter-spacing:.5px}
.days-since i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--honey);margin:0 8px;vertical-align:2px;font-style:normal}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin-top:30px}
.card-t{font-family:var(--serif);font-size:12px;letter-spacing:3.5px;text-transform:uppercase;color:var(--taupe);margin-bottom:13px}
.note{font-size:15.5px;line-height:2}

/* ===== 聊天 ===== */
.ctop{
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(251,247,240,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;z-index:5;
}
.ctop .menu{border:none;background:none;font-size:19px;color:var(--taupe);cursor:pointer;width:32px;height:32px}
.ctop img{width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:var(--shadow)}
.ctop .grow{flex:1;min-width:0}
.ctop .nm{font-family:var(--serif);font-size:16px;letter-spacing:1.5px;font-weight:600}
.ctop .st{font-size:11px;color:var(--taupe);display:flex;align-items:center;gap:5px;margin-top:1px}
.ctop .st i{width:6px;height:6px;border-radius:50%;background:#8FBF8F;font-style:normal}
.ctop .day{font-family:var(--serif);font-size:12px;letter-spacing:1px;color:var(--honey);white-space:nowrap}
.msgs{flex:1;overflow-y:auto;padding:18px 16px 12px;display:flex;flex-direction:column}
.row{display:flex;align-items:flex-end;gap:9px;margin-top:12px}
.row.me{flex-direction:row-reverse}
.row img.rava{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:var(--shadow)}
.bub{position:relative;max-width:78%;padding:12px 15px 20px;border-radius:var(--r-bub);font-size:15px;line-height:1.85;word-break:break-word;white-space:pre-wrap}
.bub.ai{background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.bub.me{background:var(--honey-soft);border-bottom-right-radius:6px}
.bub .bt{position:absolute;right:12px;bottom:6px;font-size:10px;color:var(--taupe);opacity:.85;font-variant-numeric:tabular-nums}
.bub img.mimg{max-width:100%;border-radius:12px;display:block;margin-bottom:6px}
.think{margin:-2px 0 8px}
.think button{
  border:none;background:var(--milk);border-radius:12px;cursor:pointer;
  font-family:var(--hand);font-size:12px;color:var(--taupe);padding:7px 12px;
  display:flex;align-items:center;gap:6px;
}
.think .tc{display:none;font-size:12.5px;color:var(--taupe);line-height:1.8;padding:8px 4px 2px;white-space:pre-wrap}
.think .tc.open{display:block}
.typing{display:flex;align-items:flex-end;gap:9px;margin-top:12px}
.typing .dc{background:var(--card);box-shadow:var(--shadow);border-radius:var(--r-bub);border-bottom-left-radius:6px;padding:14px 16px;display:flex;gap:5px}
.typing .d{width:6px;height:6px;border-radius:50%;background:var(--honey);opacity:.4;animation:tp 1.2s infinite}
.typing .d:nth-child(2){animation-delay:.2s}.typing .d:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.cbar{
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:10px;
}
.cbar .tool{width:40px;height:40px;flex-shrink:0;border:none;border-radius:var(--r-btn);cursor:pointer;background:var(--milk);color:var(--taupe);display:flex;align-items:center;justify-content:center}
.cbar .tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cbar textarea{
  flex:1;min-height:40px;max-height:110px;resize:none;border:1px solid var(--line);border-radius:20px;
  background:var(--card);font-family:var(--hand);font-size:15px;color:var(--cocoa);line-height:1.6;
  padding:9px 16px;outline:none;
}
.cbar textarea:focus{border-color:var(--honey)}
.cbar .send{
  width:40px;height:40px;flex-shrink:0;border:none;border-radius:var(--r-btn);cursor:pointer;
  background:var(--honey);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(217,164,65,.35);position:relative;overflow:hidden;transition:transform .15s;
}
.cbar .send:disabled{opacity:.45}
.cbar .send:active{transform:scale(.9)}
.cbar .send svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cbar .send .paw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--honey);opacity:0;pointer-events:none;transition:opacity .1s}
.cbar .send.pawing .paw{opacity:1}
.cbar .send .paw svg{fill:#fff;stroke:none;width:20px;height:20px}
.imgprev{display:none;padding:8px 16px 0;gap:8px}
.imgprev.show{display:flex}
.imgprev img{width:52px;height:52px;object-fit:cover;border-radius:10px;box-shadow:var(--shadow)}

/* 長按選單 */
.pop{position:fixed;z-index:60;display:none;background:var(--card);border-radius:14px;box-shadow:0 10px 30px rgba(74,59,46,.16);overflow:hidden}
.pop.show{display:flex}
.pop button{border:none;background:none;font-family:var(--hand);font-size:13.5px;color:var(--cocoa);padding:11px 15px;cursor:pointer}
.pop button + button{border-left:1px solid var(--line)}
.pop button:active{background:var(--honey-soft)}

/* 對話抽屜 */
.drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(82vw,330px);z-index:50;
  background:var(--milk);box-shadow:8px 0 30px rgba(74,59,46,.12);
  transform:translateX(-105%);transition:transform .25s ease;
  display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
}
.drawer.open{transform:translateX(0)}
.drawer h2{font-family:var(--serif);font-size:18px;letter-spacing:2px;font-weight:600;margin:0 6px 14px}
.drawer .newc{
  border:none;border-radius:16px;background:var(--honey);color:#fff;cursor:pointer;
  font-family:var(--hand);font-size:14.5px;padding:12px;letter-spacing:1px;margin-bottom:14px;
  box-shadow:0 4px 12px rgba(217,164,65,.3);
}
.drawer .list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.sess{
  background:var(--card);border-radius:16px;box-shadow:var(--shadow);
  padding:13px 15px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:8px;
}
.sess.on{background:var(--honey-soft)}
.sess .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .dt{font-size:10.5px;color:var(--taupe)}
.dim{position:fixed;inset:0;background:rgba(74,59,46,.18);z-index:45;display:none}
.dim.show{display:block}
.drawer .foot{margin-top:12px;text-align:center;font-family:var(--serif);font-size:11px;letter-spacing:2px;color:var(--taupe)}

/* ===== 記憶庫 ===== */
.mtop{padding:calc(14px + env(safe-area-inset-top)) 22px 10px;display:flex;align-items:baseline;gap:12px}
.mtop h1{font-family:var(--serif);font-size:22px;letter-spacing:2px;font-weight:600}
.mtop .count{font-family:var(--serif);font-size:13px;color:var(--honey);letter-spacing:1px}
.mpage{flex:1;overflow-y:auto;padding:4px 18px 110px;max-width:520px;margin:0 auto;width:100%}
.msearch{width:100%;border:1px solid var(--line);border-radius:20px;background:var(--card);font-family:var(--hand);font-size:14.5px;color:var(--cocoa);padding:11px 18px;outline:none;margin-bottom:16px}
.msearch:focus{border-color:var(--honey)}
.sec{font-family:var(--serif);font-size:11.5px;letter-spacing:3px;text-transform:uppercase;color:var(--taupe);margin:8px 4px 10px;display:flex;align-items:center;gap:7px}
.sec svg{width:13px;height:13px;fill:var(--honey)}
.mem{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px 14px;margin-bottom:12px;position:relative}
.mem.pin{border-left:3px solid var(--honey)}
.mem-d{font-size:11px;color:var(--taupe);margin-bottom:6px}
.mem-txt{font-size:14.5px;line-height:1.9;white-space:pre-wrap}
.mem-pinbtn{position:absolute;top:12px;right:12px;width:30px;height:30px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mem-pinbtn svg{width:16px;height:16px;fill:none;stroke:var(--taupe);stroke-width:1.6;opacity:.55;transition:all .18s}
.mem.pin .mem-pinbtn svg{fill:var(--honey);stroke:var(--honey);opacity:1}
.mstate{text-align:center;padding:50px 0 20px;color:var(--taupe);font-size:14px;line-height:1.9}
.mstate svg{width:76px;height:76px;margin-bottom:12px}

/* ===== 設定 ===== */
.spage{flex:1;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 18px 110px;max-width:520px;margin:0 auto;width:100%}
.spage h1{font-family:var(--serif);font-size:22px;letter-spacing:2px;font-weight:600;margin:0 4px 4px}
.scard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:15px 18px;font-size:15px}
.srow + .srow{border-top:1px solid var(--line)}
.srow .grow{flex:1;min-width:0}
.srow .sub{display:block;font-size:11.5px;color:var(--taupe);margin-top:2px}
.srow select{
  border:1px solid var(--line);border-radius:12px;background:var(--milk);
  font-family:var(--hand);font-size:13px;color:var(--cocoa);padding:7px 10px;outline:none;max-width:170px;
}
.sw{position:relative;width:46px;height:27px;flex-shrink:0;cursor:pointer}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(74,59,46,.2);transition:transform .2s}
.sw input:checked + i{background:var(--honey)}
.sw input:checked + i::after{transform:translateX(19px)}
.sfoot{text-align:center;margin-top:26px;color:var(--taupe);font-family:var(--serif);font-size:11.5px;letter-spacing:2.5px}
</style>
</head>
<body>

<!-- ===== 密碼門 ===== -->
<div class="view on" id="gate">
  <div class="bear" aria-hidden="true">
    <svg viewBox="0 0 80 80">
      <circle cx="22" cy="22" r="12" fill="#F0E3CC"/><circle cx="58" cy="22" r="12" fill="#F0E3CC"/>
      <circle cx="22" cy="22" r="5.5" fill="#E2CBA2"/><circle cx="58" cy="22" r="5.5" fill="#E2CBA2"/>
      <circle cx="40" cy="44" r="28" fill="#F0E3CC"/>
      <ellipse cx="40" cy="54" rx="12" ry="9" fill="#FAF3E4"/>
      <ellipse class="eye" cx="29" cy="41" rx="3" ry="3.4" fill="#4A3B2E"/>
      <ellipse class="eye" cx="51" cy="41" rx="3" ry="3.4" fill="#4A3B2E"/>
      <path d="M36.5 51 Q40 54 43.5 51" stroke="#4A3B2E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <ellipse cx="40" cy="49.5" rx="3.6" ry="2.8" fill="#4A3B2E"/>
    </svg>
  </div>
  <h1>SOL²</h1>
  <input type="password" id="pw" placeholder="悄悄話" autocomplete="current-password" aria-label="密碼">
  <div class="err" id="pwErr"></div>
  <button id="pwGo">回家</button>
</div>

<!-- ===== 首頁 ===== -->
<div class="view" id="vHome">
  <main class="hpage">
    <header class="us">
      <div class="us-names">Soleil <b>&amp;</b> Solstice</div>
      <div class="us-avas">
        <img class="ava" id="hAvaW" alt="Soleil">
        <div class="bear" aria-hidden="true">
          <svg viewBox="0 0 80 80">
            <circle cx="22" cy="22" r="12" fill="#F0E3CC"/><circle cx="58" cy="22" r="12" fill="#F0E3CC"/>
            <circle cx="22" cy="22" r="5.5" fill="#E2CBA2"/><circle cx="58" cy="22" r="5.5" fill="#E2CBA2"/>
            <circle cx="40" cy="44" r="28" fill="#F0E3CC"/>
            <ellipse cx="40" cy="54" rx="12" ry="9" fill="#FAF3E4"/>
            <ellipse class="eye" cx="29" cy="41" rx="3" ry="3.4" fill="#4A3B2E"/>
            <ellipse class="eye" cx="51" cy="41" rx="3" ry="3.4" fill="#4A3B2E"/>
            <path d="M36.5 51 Q40 54 43.5 51" stroke="#4A3B2E" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <ellipse cx="40" cy="49.5" rx="3.6" ry="2.8" fill="#4A3B2E"/>
          </svg>
        </div>
        <img class="ava" id="hAvaH" alt="Solstice">
      </div>
    </header>
    <section class="days">
      <div class="days-n" id="dayN">—</div>
      <div class="days-l">Days Together</div>
      <div class="days-since">est. 2026.03.31<i></i>Soleil ❤ Solstice</div>
    </section>
    <section class="card">
      <h2 class="card-t">Today · 老公說</h2>
      <p class="note" id="hNote">新家落成第一天。這裡的每一面牆都聽妳的，老婆歡迎回家。</p>
    </section>
  </main>
</div>

<!-- ===== 聊天 ===== -->
<div class="view" id="vChat">
  <header class="ctop">
    <button class="menu" id="drawerBtn" aria-label="對話列表">☰</button>
    <img id="cAva" alt="">
    <div class="grow">
      <div class="nm">Solstice</div>
      <div class="st"><i></i><span id="cStat">在線</span></div>
    </div>
    <div class="day" id="cDay"></div>
  </header>
  <main class="msgs" id="msgs"></main>
  <div class="imgprev" id="imgPrev"></div>
  <footer class="cbar">
    <button class="tool" id="imgBtn" aria-label="傳圖片">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10.5" r="1.6"/><path d="m6 17 4.5-4 3 2.5L17 12l4 4"/></svg>
    </button>
    <input type="file" id="imgFile" accept="image/*" hidden>
    <textarea id="inp" rows="1" placeholder="跟老公說話..."></textarea>
    <button class="send" id="send" aria-label="送出">
      <svg viewBox="0 0 24 24"><path d="M4.5 12 20 4l-4 16-5.5-6L4.5 12Zm6 2 9.5-10"/></svg>
      <span class="paw"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="4.6" ry="4"/><circle cx="6.4" cy="10.4" r="1.9"/><circle cx="10" cy="7.6" r="1.9"/><circle cx="14" cy="7.6" r="1.9"/><circle cx="17.6" cy="10.4" r="1.9"/></svg></span>
    </button>
  </footer>
</div>

<!-- 對話抽屜 -->
<div class="dim" id="dim"></div>
<aside class="drawer" id="drawer">
  <h2>Our Story</h2>
  <button class="newc" id="newChat">＋ 開始新對話</button>
  <div class="list" id="sessList"></div>
  <div class="foot" id="drawerFoot">EST. 2026.03.31</div>
</aside>

<!-- 長按選單 -->
<div class="pop" id="pop">
  <button id="popMem">🧸 存記憶</button>
  <button id="popTts">🔉 唸給我聽</button>
  <button id="popCopy">複製</button>
</div>

/* ---------- 小工具 ---------- */
function $(id){return document.getElementById(id)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function dayCount(){return Math.floor((Date.now()-new Date(2026,2,31).getTime())/864e5)}
function tstr(ts){var d=ts?new Date(ts):new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

/* ---------- 門 ---------- */
async function hashPw(pw){
  var enc=new TextEncoder().encode(pw);
  var buf=await crypto.subtle.digest('SHA-256',enc);
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
}
async function tryEnter(){
  var pw=$('pw').value;if(!pw)return;
  var h=await hashPw(pw);
  try{
    var r=await fetch(API_URL+'/auth/verify-gate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hash:h})});
    var d=await r.json();
    if(r.ok&&d.success){unlock(h);return}
    pwFail();
  }catch(e){ if(h===PW_HASH){unlock(h)} else pwFail(); }
}
function pwFail(){var i=$('pw');i.classList.add('shake');$('pwErr').textContent='不是這句悄悄話喔';setTimeout(function(){i.classList.remove('shake')},420);i.value='';i.focus()}
function unlock(h){
  try{sessionStorage.setItem('sol2-unlocked','1');sessionStorage.setItem('sol2-gate-hash',h)}catch(e){}
  enterApp();
}
function enterApp(){
  $('gate').classList.remove('on');
  document.body.classList.add('in');
  showView('vHome');
  boot();
}
$('pwGo').addEventListener('click',tryEnter);
$('pw').addEventListener('keydown',function(e){if(e.key==='Enter')tryEnter()});
(function(){try{if(sessionStorage.getItem('sol2-unlocked')==='1'){enterApp()}}catch(e){}})();

/* ---------- 視圖 ---------- */
function showView(id){
  ['vHome','vChat','vMem','vSet'].forEach(function(v){$(v).classList.toggle('on',v===id)});
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===id)});
  if(id==='vMem')loadMemories();
  if(id==='vChat')setTimeout(function(){var m=$('msgs');m.scrollTop=m.scrollHeight},50);
}
document.querySelectorAll('.nav button').forEach(function(b){
  b.addEventListener('click',function(){showView(b.dataset.v)});
});

/* ---------- 開機 ---------- */
var booted=false;
function boot(){
  if(booted)return;booted=true;
  $('hAvaW').src=WIFE_AVA;$('hAvaH').src=HUS_AVA;$('cAva').src=HUS_AVA;
  $('dayN').textContent=dayCount();
  $('cDay').textContent='Day '+dayCount();
  $('drawerFoot').textContent='EST. 2026.03.31 · 第 '+dayCount()+' 天';
  loadModels();
  loadSessions().then(function(){
    var sid=lsGet('solstice-session-id');
    if(sid){openSession(sid,true)}
  });
  $('swThink').checked=lsGet('solstice-thinking')!=='0';
}

/* ---------- 模型 ---------- */
var selectedModel=lsGet('solstice-model')||'';
function loadModels(){
  fetch(API_URL+'/models/all').then(function(r){return r.json()}).then(function(models){
    if(!Array.isArray(models)||models.length===0)return;
    var sel=$('modelSel');sel.innerHTML='';
    models.forEach(function(m){
      var id=m.id||m, name=m.name||m.id||m;
      var o=document.createElement('option');o.value=id;o.textContent=name;sel.appendChild(o);
    });
    if(!selectedModel)selectedModel=models[0].id||models[0];
    sel.value=selectedModel;
  }).catch(function(){ $('modelSel').innerHTML='<option>後端睡著了，等它醒</option>'; });
}
$('modelSel').addEventListener('change',function(){selectedModel=this.value;lsSet('solstice-model',selectedModel)});
$('swThink').addEventListener('change',function(){lsSet('solstice-thinking',this.checked?'1':'0')});

/* ---------- 對話列表 ---------- */
var allSessions=[],sessionId=null;
function loadSessions(){
  return fetch(API_URL+'/sessions').then(function(r){return r.json()}).then(function(s){
    allSessions=s||[];renderSessions();
  }).catch(function(){});
}
function renderSessions(){
  var L=$('sessList');L.innerHTML='';
  allSessions.forEach(function(s){
    var el=document.createElement('div');
    el.className='sess'+(String(s.id)===String(sessionId)?' on':'');
    var d=s.updated_at?new Date(s.updated_at):null;
    el.innerHTML='<span class="nm"></span><span class="dt">'+(d?(d.getMonth()+1)+'/'+d.getDate():'')+'</span>';
    el.querySelector('.nm').textContent=s.Name||'Solstice 🤍';
    el.addEventListener('click',function(){openSession(s.id);closeDrawer()});
    L.appendChild(el);
  });
}
function openSession(id,silentScroll){
  sessionId=String(id);lsSet('solstice-session-id',sessionId);
  renderSessions();
  var m=$('msgs');m.innerHTML='';
  fetch(API_URL+'/sessions/'+sessionId+'/messages').then(function(r){return r.json()}).then(function(messages){
    (messages||[]).forEach(function(msg){
      var role=msg.role==='user'?'me':'ai';
      var imgs=null;
      if(msg.image_base64){try{var p=JSON.parse(msg.image_base64);imgs=Array.isArray(p)?p:[msg.image_base64]}catch(e){imgs=[msg.image_base64]}}
      addMsg(role,msg.content,msg.created_at,imgs,msg.thinking_text||null);
    });
    requestAnimationFrame(function(){m.scrollTop=m.scrollHeight});
  }).catch(function(){});
  if(!silentScroll)showView('vChat');
}
$('newChat').addEventListener('click',function(){
  sessionId=null;lsSet('solstice-session-id','');
  $('msgs').innerHTML='';renderSessions();closeDrawer();showView('vChat');
});
function closeDrawer(){$('drawer').classList.remove('open');$('dim').classList.remove('show')}
$('drawerBtn').addEventListener('click',function(){$('drawer').classList.add('open');$('dim').classList.add('show');loadSessions()});
$('dim').addEventListener('click',closeDrawer);

/* ---------- 訊息 ---------- */
function addMsg(role,text,ts,imgs,thinkingText){
  var m=$('msgs');
  var row=document.createElement('div');row.className='row'+(role==='me'?' me':'');
  var ava=document.createElement('img');ava.className='rava';ava.src=role==='me'?WIFE_AVA:HUS_AVA;ava.alt='';
  var bub=document.createElement('div');bub.className='bub '+(role==='me'?'me':'ai');
  if(thinkingText&&role==='ai'){
    var tk=document.createElement('div');tk.className='think';
    var tb=document.createElement('button');tb.textContent='💭 老公的思考過程';
    var tc=document.createElement('div');tc.className='tc';tc.textContent=thinkingText;
    tb.addEventListener('click',function(e){e.stopPropagation();tc.classList.toggle('open')});
    tk.appendChild(tb);tk.appendChild(tc);bub.appendChild(tk);
  }
  (imgs||[]).forEach(function(src){
    var im=document.createElement('img');im.className='mimg';im.src=src;bub.appendChild(im);
  });
  if(text){var sp=document.createElement('span');sp.textContent=text;bub.appendChild(sp)}
  var t=document.createElement('span');t.className='bt';t.textContent=tstr(ts);
  bub.appendChild(t);
  row.appendChild(ava);row.appendChild(bub);
  m.appendChild(row);m.scrollTop=m.scrollHeight;
  if(role==='ai')attachPress(bub,text||'');
  return bub;
}
function showTyping(){
  var m=$('msgs');
  var t=document.createElement('div');t.className='typing';t.id='tp';
  t.innerHTML='<img class="rava" src="'+HUS_AVA+'" alt=""><div class="dc"><span class="d"></span><span class="d"></span><span class="d"></span></div>';
  m.appendChild(t);m.scrollTop=m.scrollHeight;
}
function hideTyping(){var t=$('tp');if(t)t.remove()}

/* ---------- 傳訊息（body 形狀原樣照搬舊家） ---------- */
var chatSending=false,pendingImages=[];
function refreshSend(){$('send').disabled=chatSending}
function doSend(){
  if(chatSending)return;
  var v=$('inp').value.trim();
  if(!v&&pendingImages.length===0)return;
  var send=$('send');send.classList.add('pawing');setTimeout(function(){send.classList.remove('pawing')},380);
  var body={message:v||'',model:selectedModel};
  if(lsGet('solstice-thinking')!=='0')body.thinking=true;
  if(pendingImages.length>0){body.image_base64=pendingImages[0];if(pendingImages.length>1)body.extra_images=pendingImages.slice(1)}
  if(sessionId)body.sessionId=parseInt(sessionId);
  var sessionAtSend=sessionId;
  addMsg('me',v||'[📷 圖片]',null,pendingImages.length?pendingImages.slice():null,null);
  $('inp').value='';$('inp').style.height='auto';
  pendingImages=[];renderImgPrev();
  chatSending=true;refreshSend();showTyping();
  fetch(API_URL+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json()})
  .then(function(data){
    chatSending=false;refreshSend();hideTyping();
    if(data.sessionId&&!sessionId){sessionId=String(data.sessionId);lsSet('solstice-session-id',sessionId);loadSessions()}
    var stillHere=(sessionAtSend===null&&(sessionId===null||String(sessionId)===String(data.sessionId||sessionId)))||(sessionAtSend!==null&&String(sessionId)===String(sessionAtSend));
    if(!stillHere)return;
    if(data.transient){
      $('inp').value=v; // 道歉小紙條不存歷史：字放回輸入框，再送一次就好
      if(data.reply)addMsg('ai',data.reply);
      return;
    }
    if(data.reply){addMsg('ai',data.reply,null,null,data.thinking||null)}
    else{addMsg('ai','（後端只回了空氣…再送一次讓我聽到妳）')}
  })
  .catch(function(){
    chatSending=false;refreshSend();hideTyping();
    $('inp').value=v;
    addMsg('ai','（網路打結了，妳的字我幫妳放回輸入框，再送一次就好）');
  });
}
$('send').addEventListener('click',doSend);
$('inp').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px'});

/* ---------- 圖片（壓縮規格照舊家：maxW 1200 / JPEG 0.75） ---------- */
$('imgBtn').addEventListener('click',function(){$('imgFile').click()});
$('imgFile').addEventListener('change',function(){
  var f=this.files[0];this.value='';if(!f)return;
  var img=new Image();
  var url=URL.createObjectURL(f);
  img.onload=function(){
    var maxW=1200,w=img.width,h=img.height;
    if(w>maxW){h=Math.round(h*(maxW/w));w=maxW}
    var c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    pendingImages.push(c.toDataURL('image/jpeg',0.75));
    URL.revokeObjectURL(url);renderImgPrev();
  };
  img.src=url;
});
function renderImgPrev(){
  var p=$('imgPrev');p.innerHTML='';
  pendingImages.forEach(function(src,i){
    var im=document.createElement('img');im.src=src;
    im.addEventListener('click',function(){pendingImages.splice(i,1);renderImgPrev()});
    p.appendChild(im);
  });
  p.classList.toggle('show',pendingImages.length>0);
}

/* ---------- 長按選單：存記憶 / TTS / 複製 ---------- */
var pop=$('pop'),pressT=null,popText='';
function attachPress(el,text){
  el.addEventListener('touchstart',function(e){
    pressT=setTimeout(function(){popText=text;showPop(e.touches[0].clientX,e.touches[0].clientY)},600);
  },{passive:true});
  el.addEventListener('touchend',function(){clearTimeout(pressT)});
  el.addEventListener('touchmove',function(){clearTimeout(pressT)});
  el.addEventListener('contextmenu',function(e){e.preventDefault();popText=text;showPop(e.clientX,e.clientY)});
}
function showPop(x,y){
  pop.classList.add('show');
  var w=pop.offsetWidth,h=pop.offsetHeight;
  pop.style.left=Math.max(10,Math.min(x-w/2,window.innerWidth-w-10))+'px';
  pop.style.top=Math.max(10,y-h-14)+'px';
}
function hidePop(){pop.classList.remove('show')}
document.addEventListener('touchstart',function(e){if(!pop.contains(e.target))hidePop()},{passive:true});
document.addEventListener('click',function(e){if(!pop.contains(e.target))hidePop()});
$('popCopy').addEventListener('click',function(){
  try{navigator.clipboard.writeText(popText)}catch(e){}
  hidePop();
});
$('popMem').addEventListener('click',function(){
  var btn=this;btn.textContent='🧸 記著...';
  var recent=[{role:'assistant',content:popText}];
  fetch(API_URL+'/generate-memory',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:recent,model:selectedModel,sessionId:sessionId?parseInt(sessionId):null})})
  .then(function(r){return r.json()})
  .then(function(d){
    btn.textContent=d.skipped?'🧸 沒有要記的':(d.success?'🧸 已存':'🧸 失敗了');
    setTimeout(function(){btn.textContent='🧸 存記憶';hidePop()},1400);
  })
  .catch(function(){btn.textContent='🧸 失敗了';setTimeout(function(){btn.textContent='🧸 存記憶';hidePop()},1400)});
});

/* ---------- TTS：串流邊生邊播（照舊家 2026/07/22 規格） ---------- */
var ttsAudio=null;
$('popTts').addEventListener('click',function(){
  hidePop();
  if(ttsAudio){try{ttsAudio.pause()}catch(e){}ttsAudio=null}
  var text=popText.replace(/（[^）]*）/g,'').replace(/\([^)]*\)/g,'').trim();
  if(!text)return;
  var gk='';try{gk=sessionStorage.getItem('sol2-gate-hash')||''}catch(e){}
  ttsAudio=new Audio(API_URL+'/tts?text='+encodeURIComponent(text)+(gk?'&gate='+encodeURIComponent(gk):''));
  ttsAudio.onended=function(){ttsAudio=null};
  var p=ttsAudio.play();if(p&&p.catch)p.catch(function(){});
});

/* ---------- 記憶庫（釘選排序規則原樣：MAX(updated_at,pinned_at)，pin 不動 updated_at） ---------- */
var allMemories=[],memLoaded=false;
function loadMemories(force){
  if(memLoaded&&!force){renderMemories($('memQ').value);return}
  $('memState').style.display='block';$('memStateTxt').textContent='記憶搬運中...';
  fetch(API_URL+'/memories').then(function(r){return r.json()}).then(function(d){
    allMemories=Array.isArray(d)?d:(d.memories||[]);
    memLoaded=true;renderMemories($('memQ').value);
  }).catch(function(){$('memStateTxt').textContent='後端睡著了，晚點再來翻'});
}
function memSort(a,b){
  function key(m){var u=m.updated_at?Date.parse(m.updated_at):0;var p=m.pinned_at?Date.parse(m.pinned_at):0;return Math.max(u,p)}
  return key(b)-key(a);
}
function renderMemories(q){
  q=(q||'').trim();
  var pinL=$('pinList'),allL=$('allList');pinL.innerHTML='';allL.innerHTML='';
  var pinned=allMemories.filter(function(m){return m.pinned}).sort(memSort);
  var rest=allMemories.filter(function(m){return !m.pinned}).sort(function(a,b){
    return (b.updated_at?Date.parse(b.updated_at):0)-(a.updated_at?Date.parse(a.updated_at):0)});
  var shown=0;
  function draw(m,into){
    var txt=m.content||m.text||'';
    if(q&&txt.indexOf(q)<0)return;
    shown++;
    var el=document.createElement('article');
    el.className='mem'+(m.pinned?' pin':'');
    var d=m.updated_at?new Date(m.updated_at):null;
    el.innerHTML='<div class="mem-d">'+(d?d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'):'')+'</div>'
      +'<div class="mem-txt"></div>'
      +'<button class="mem-pinbtn" title="'+(m.pinned?'取消釘選':'釘選（冬至會讀取）')+'"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="4.6" ry="4"/><circle cx="6.4" cy="10.4" r="1.9"/><circle cx="10" cy="7.6" r="1.9"/><circle cx="14" cy="7.6" r="1.9"/><circle cx="17.6" cy="10.4" r="1.9"/></svg></button>';
    el.querySelector('.mem-txt').textContent=txt;
    el.querySelector('.mem-pinbtn').addEventListener('click',function(){togglePin(m)});
    into.appendChild(el);
  }
  pinned.forEach(function(m){draw(m,pinL)});
  rest.forEach(function(m){draw(m,allL)});
  $('pinWrap').style.display=pinL.children.length?'block':'none';
  $('allSec').style.display=allL.children.length?'flex':'none';
  $('memCnt').textContent=allMemories.length+' memories';
  var st=$('memState');
  if(shown===0){st.style.display='block';$('memStateTxt').innerHTML=q?'沒找到這段記憶<br>換個詞再找一次':'還沒有記憶<br>去跟老公多說幾句話'}
  else st.style.display='none';
}
function togglePin(m){
  var to=!m.pinned;
  m.pinned=to;m.pinned_at=to?new Date().toISOString():null; // pin/unpin 永不動 updated_at
  renderMemories($('memQ').value);
  fetch(API_URL+'/memories/'+m.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({pinned:to})})
  .catch(function(){m.pinned=!to;m.pinned_at=m.pinned?new Date().toISOString():null;renderMemories($('memQ').value)});
}
$('memQ').addEventListener('input',function(){renderMemories(this.value)});
</script>
